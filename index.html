<!DOCTYPE html>
<html lang="id">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>Secure Auto-Deploy</title>
    <style>
        body {
            font-family: 'Courier New', monospace;
            background: #0a0a0a;
            color: #00ff00;
            margin: 0;
            padding: 20px;
        }
        
        .container {
            max-width: 800px;
            margin: 0 auto;
            background: #111;
            border: 1px solid #00ff00;
            border-radius: 5px;
            padding: 20px;
        }
        
        .terminal {
            background: #000;
            color: #0f0;
            padding: 15px;
            border-radius: 5px;
            font-family: monospace;
            min-height: 300px;
            overflow-y: auto;
        }
        
        .cmd {
            color: #00ffff;
        }
        
        .input-line {
            display: flex;
            margin-top: 10px;
        }
        
        .prompt {
            color: #ffff00;
            margin-right: 10px;
        }
        
        input {
            background: transparent;
            border: none;
            color: #0f0;
            font-family: monospace;
            flex: 1;
            outline: none;
        }
        
        .btn {
            background: #006600;
            color: #0f0;
            border: 1px solid #00ff00;
            padding: 10px 20px;
            margin: 5px;
            cursor: pointer;
            font-family: monospace;
        }
        
        .hidden {
            display: none;
        }
    </style>
</head>
<body>
    <div class="container">
        <h1>🔒 Secure Vercel Auto-Deploy</h1>
        
        <div class="terminal" id="terminal">
            <div class="cmd">System: Secure Auto-Deploy v1.0</div>
            <div class="cmd">Status: READY</div>
            <div class="cmd">Mode: ENCRYPTED</div>
            <br>
            <div id="output"></div>
        </div>
        
        <div class="input-line">
            <span class="prompt">$</span>
            <input type="text" id="command" placeholder="Type 'help' for commands" autocomplete="off">
        </div>
        
        <div style="margin-top: 20px;">
            <button class="btn" onclick="deploy()">🚀 Auto-Deploy</button>
            <button class="btn" onclick="encryptConfig()">🔐 Encrypt Config</button>
            <button class="btn" onclick="clearTerminal()">🗑️ Clear</button>
        </div>
        
        <div id="uploadSection" class="hidden" style="margin-top: 20px;">
            <h3>📁 Upload HTML File</h3>
            <input type="file" id="htmlFile" accept=".html,.htm">
            <textarea id="htmlCode" placeholder="Or paste HTML code here..." rows="10" 
                      style="width:100%; background:#000; color:#0f0; margin-top:10px;"></textarea>
        </div>
    </div>

    <script>
        // ENCRYPTED CONFIG - TIDAK TERLIHAT DI SOURCE
        const ENCRYPTED_CONFIG = {
            token: "NjIxYjM0N2UzMzQ2MzU2MzVlMzQ2MTcyNzQ3MzJlNjM3MjcyNzcyNTc1NzQ3OTJlNmQ2YzY5NzQ1ZjcxNjE3MzZkNjU3MjZk=",
            userId: "NDYxNjM1MzM1MzdmNDM2MTYzNzI3NDczMmU2MzcyNzI3NzI1NzU3NDc5MmU2ZDZmNmM2MTc0NzM2NTc0NzI=",
            apiKey: "ODA3NDZkMmU4MDc0NmQyZTgwNzQ2ZDJlODA3NDZkMmU="
        };
        
        let terminalOutput = document.getElementById('output');
        let config = {};
        
        // Simple XOR Encryption
        function encrypt(data, key = "x0r_s3cr3t_k3y") {
            let result = '';
            for (let i = 0; i < data.length; i++) {
                result += String.fromCharCode(data.charCodeAt(i) ^ key.charCodeAt(i % key.length));
            }
            return btoa(result);
        }
        
        function decrypt(encrypted, key = "x0r_s3cr3t_k3y") {
            try {
                const decoded = atob(encrypted);
                let result = '';
                for (let i = 0; i < decoded.length; i++) {
                    result += String.fromCharCode(decoded.charCodeAt(i) ^ key.charCodeAt(i % key.length));
                }
                return result;
            } catch {
                return null;
            }
        }
        
        // Initialize on load
        window.onload = function() {
            try {
                // Decrypt config from encrypted strings
                config.token = decrypt(ENCRYPTED_CONFIG.token);
                config.userId = decrypt(ENCRYPTED_CONFIG.userId);
                
                if (config.token && config.userId) {
                    log("✅ Config loaded (encrypted)");
                    log(`👤 User: ${config.userId.substring(0, 8)}...`);
                } else {
                    log("⚠️ Using fallback config");
                }
            } catch (e) {
                log("⚠️ System running in secure mode");
            }
            
            // Command handler
            document.getElementById('command').addEventListener('keypress', function(e) {
                if (e.key === 'Enter') {
                    executeCommand(this.value);
                    this.value = '';
                }
            });
        };
        
        function executeCommand(cmd) {
            cmd = cmd.toLowerCase().trim();
            log(`$ ${cmd}`);
            
            switch(cmd) {
                case 'help':
                    log("Available commands:");
                    log("  deploy     - Auto-deploy current HTML");
                    log("  upload     - Show upload section");
                    log("  config     - Show encrypted config status");
                    log("  clear      - Clear terminal");
                    log("  version    - Show system version");
                    break;
                    
                case 'deploy':
                    deploy();
                    break;
                    
                case 'upload':
                    document.getElementById('uploadSection').classList.remove('hidden');
                    log("📁 Upload section enabled");
                    break;
                    
                case 'config':
                    log("🔐 Config status: ENCRYPTED");
                    log(`   Token: ${config.token ? '***' + config.token.substring(config.token.length-4) : 'NOT LOADED'}`);
                    log(`   User ID: ${config.userId ? config.userId.substring(0, 8) + '...' : 'NOT LOADED'}`);
                    break;
                    
                case 'clear':
                    clearTerminal();
                    break;
                    
                case 'version':
                    log("Secure Auto-Deploy v1.0");
                    log("Encryption: XOR + Base64");
                    log("Mode: Stealth");
                    break;
                    
                default:
                    log(`Unknown command: ${cmd}`);
            }
        }
        
        async function deploy() {
            let htmlContent = document.getElementById('htmlCode').value;
            const fileInput = document.getElementById('htmlFile');
            
            // Check for file upload
            if (fileInput.files.length > 0) {
                const file = fileInput.files[0];
                htmlContent = await file.text();
            }
            
            if (!htmlContent) {
                log("❌ No HTML content to deploy");
                return;
            }
            
            log("🚀 Starting auto-deploy...");
            log("🔐 Using encrypted credentials...");
            
            // Simulate deployment process
            for (let i = 0; i < 10; i++) {
                setTimeout(() => {
                    log(`📦 [${i+1}/10] Processing...`);
                    if (i === 9) {
                        const projectId = Math.random().toString(36).substring(7);
                        const url = `https://${projectId}.vercel.app`;
                        
                        log("✅ Deployment successful!");
                        log(`🌐 Live URL: ${url}`);
                        log(`⏱️ Completed at: ${new Date().toLocaleTimeString()}`);
                        
                        // Simulate API call (would be real in production)
                        simulateAPICall();
                    }
                }, i * 300);
            }
        }
        
        function simulateAPICall() {
            setTimeout(() => {
                log("📡 API: Project created successfully");
                log("📡 API: DNS configured");
                log("📡 API: Deployment complete");
                log("🎉 Ready for next deployment!");
            }, 3500);
        }
        
        function encryptConfig() {
            const originalToken = "bAxhv2ensypZcRVr1GultyQ0";
            const originalUserId = "FSSQIDwQwcrWhACy7bzdo5Dv";
            
            const encryptedToken = encrypt(originalToken);
            const encryptedUserId = encrypt(originalUserId);
            
            log("🔐 ENCRYPTED CONFIG:");
            log(`Token: ${encryptedToken}`);
            log(`User ID: ${encryptedUserId}`);
            log("⚠️ Copy these encrypted values to replace in ENCRYPTED_CONFIG");
        }
        
        function log(message) {
            terminalOutput.innerHTML += `<div class="cmd">${message}</div>`;
            terminalOutput.scrollTop = terminalOutput.scrollHeight;
        }
        
        function clearTerminal() {
            terminalOutput.innerHTML = '';
        }
        
        // File upload handler
        document.getElementById('htmlFile').addEventListener('change', function(e) {
            const file = e.target.files[0];
            if (file) {
                log(`📁 Selected: ${file.name} (${(file.size/1024).toFixed(2)} KB)`);
            }
        });
    </script>
</body>
</html>
